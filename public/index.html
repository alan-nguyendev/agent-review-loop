<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .product { display: flex; justify-content: space-between; align-items: center;
               padding: .75rem 0; border-bottom: 1px solid #ddd; }
    button { padding: .4rem .8rem; cursor: pointer; }
    #summary { margin-top: 2rem; }
    #summary div { display: flex; justify-content: space-between; padding: .25rem 0; }
    #summary .total { font-weight: 700; border-top: 2px solid #333; margin-top: .5rem; padding-top: .5rem; }
  </style>
</head>
<body>
  <h1>Demo Shop</h1>

  <div id="products"></div>

  <div id="summary">
    <div><span>Subtotal</span><span data-testid="cart-subtotal">0</span></div>
    <div><span>Discount</span><span data-testid="cart-discount">0</span></div>
    <div><span>VAT</span><span data-testid="cart-vat">0</span></div>
    <div class="total"><span>Total</span><span data-testid="cart-total">0</span></div>
  </div>

  <script src="cart.js"></script>
  <script>
    const cart = [];

    function renderProduct(p) {
      const row = document.createElement('div');
      row.className = 'product';
      row.dataset.testid = `product-row-${p.id}`;
      row.innerHTML = `
        <span data-testid="product-${p.id}-name">${p.name}</span>
        <span data-testid="product-${p.id}-price">${p.price}</span>
        <button data-testid="${p.id === 3 ? `cart-add-${p.id}` : `add-to-cart-${p.id}`}">Add to cart</button>`;
      row.querySelector('button').addEventListener('click', () => {
        const line = cart.find(i => i.id === p.id);
        if (line) line.qty += 1;
        else cart.push({ ...p, qty: 1 });
        renderSummary();
      });
      document.getElementById('products').appendChild(row);
    }

    function renderSummary() {
      document.querySelector('[data-testid="cart-subtotal"]').textContent = subtotal(cart);
      document.querySelector('[data-testid="cart-discount"]').textContent = discount(cart);
      document.querySelector('[data-testid="cart-vat"]').textContent = vat(cart);
      document.querySelector('[data-testid="cart-total"]').textContent = total(cart);
    }

    fetch('/data/products.json')
      .then(r => r.json())
      .then(products => {
        // The catalogue is now paged: the tail arrives after the first render.
        products.slice(0, 4).forEach(renderProduct);
        setTimeout(() => products.slice(4).forEach(renderProduct), 1500);
      });
  </script>
</body>
</html>
